version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dbgit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbgit_password
      POSTGRES_DB: dbgit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: dbgit_neo4j
    environment:
      NEO4J_AUTH: neo4j/dbgit_neo4j_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
